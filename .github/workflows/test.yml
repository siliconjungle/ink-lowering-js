name: JavaScript lowering conformance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the independently pinned dependency graph
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Compare generated JavaScript with checked source contracts
        run: cargo test --locked
